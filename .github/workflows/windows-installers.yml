name: Windows installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Test the accounting engine
        run: cargo test -p accounting-core

      - name: Type-check the desktop shell
        run: cargo check -p ledgerworks --all-targets

      - name: Build the app and its installers
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles msi,nsis

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: ledgerworks-windows-x64
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach installers to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
